name: E2E Tests

on:
  pull_request:
    branches: [main, stage]
  push:
    branches: [main, stage]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Tests - ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        os: [ubuntu-latest]
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build Next.js app
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.os }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.browser }}-${{ matrix.os }}
          path: test-results/
          retention-days: 30

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ matrix.browser }}-${{ matrix.os }}
          path: test-results/**/*.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-${{ matrix.browser }}-${{ matrix.os }}
          path: test-results/**/*.webm
          retention-days: 30
          if-no-files-found: ignore

  e2e-summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.e2e.result }}" == "failure" ]; then
            echo "❌ E2E tests failed"
            exit 1
          elif [ "${{ needs.e2e.result }}" == "success" ]; then
            echo "✅ All E2E tests passed"
          else
            echo "⚠️ E2E tests were skipped or cancelled"
          fi

